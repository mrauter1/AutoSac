<section
  id="ticket-status-region"
  class="page-header page-header--card page-header--stack requester-detail__header"
  {% if live_oob %}hx-swap-oob="outerHTML"{% endif %}
>
  <div class="ticket-card__meta">
    <span class="ticket-ref">{{ ticket.reference }}</span>
    <span class="status-pill">{{ requester_status_label(ticket.status) }}</span>
    {% if ticket.urgent %}
    <span class="urgent-pill">{{ t("common.urgent") }}</span>
    {% endif %}
  </div>
  <h1>{{ ticket.title }}</h1>
</section>
